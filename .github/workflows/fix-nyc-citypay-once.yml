name: Fix NYC CityPay link once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-link:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace obsolete NYC CityPay URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('features/dmv/tickets.ts')
          text = path.read_text(encoding='utf-8')
          old_url = 'https://a836-citypay.nyc.gov/citypay/ParkingCamera'
          new_url = 'https://www.nyc.gov/citypay'
          old_description = '适合纽约市停车罚单、红灯拍照罚单（Red Light Camera）、超速拍照罚单（Speed Camera）等。可输入罚单号或车牌号查询和缴费。'
          new_description = '适合纽约市停车罚单、红灯拍照罚单（Red Light Camera）、超速拍照罚单（Speed Camera）等。进入 NYC CityPay 后选择 Parking Tickets / Camera Violations 查询和缴费。'

          if old_url not in text:
              print('Old URL is already absent; no URL replacement needed.')
          else:
              text = text.replace(old_url, new_url, 1)

          if old_description in text:
              text = text.replace(old_description, new_description, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify replacement
        shell: bash
        run: |
          grep -F "https://www.nyc.gov/citypay" features/dmv/tickets.ts
          if grep -F "https://a836-citypay.nyc.gov/citypay/ParkingCamera" features/dmv/tickets.ts; then
            echo "Old CityPay URL still exists"
            exit 1
          fi

      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-nyc-citypay-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/dmv/tickets.ts .github/workflows/fix-nyc-citypay-once.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix(dmv): update NYC CityPay ticket link"
          git push origin main
